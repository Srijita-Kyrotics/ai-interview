services:
  - type: keyvalue
    name: ai-interview-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

  - type: web
    name: ai-interview-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interview-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-interview-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production

  - type: web
    name: ai-interview-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-interview-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_WS_URL
        fromService:
          type: web
          name: ai-interview-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ai-interview-db
    databaseName: ai_interview
    user: ai_interview_user
    plan: free
